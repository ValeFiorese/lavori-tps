<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Convertitore in Euro</title>
</head>
<body>
<h2>Convertitore in Euro</h2>
Divisa: <select id="divisa" onchange="calcola()"></select><br><br>
Quantità: <input id="quantita" value="100" oninput="calcola()"><br><br>
<b id="risultato"></b>

<script>
var tassi = {};

function calcola() {
  risultato.innerHTML = (quantita.value / tassi[divisa.value]).toFixed(2) + " EUR";
}

var x = new XMLHttpRequest();
x.open("GET", "https://proxy.cors.dev/https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml");
x.onload = function () {
  var c = new DOMParser().parseFromString(x.responseText, "text/xml").querySelectorAll("Cube[currency]");
  for (var i = 0; i < c.length; i++) {
    tassi[c[i].getAttribute("currency")] = c[i].getAttribute("rate");
    divisa.innerHTML += "<option>" + c[i].getAttribute("currency") + "</option>";
  }
  calcola();
};
x.send();
</script>
</body>
</html>
