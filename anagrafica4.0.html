<!DOCTYPE html>
<html>
<body>
<h1>Anagrafica 4.0 - Inserimento</h1>

Nome: <input type="text" id="nome"><br>
Cognome: <input type="text" id="cognome"><br>
Età: <input type="text" id="eta"><br>
Colore occhi: <input type="text" id="occhi"><br><br>

<button onclick="salva()">Aggiungi</button>
<button onclick="vai()">Vai alla visualizzazione</button>

<script>
function salva() {

  let elenco = localStorage.getItem("elenco");
  elenco = elenco ? JSON.parse(elenco) : [];

  const persona = {
    nome: document.getElementById("nome").value,
    cognome: document.getElementById("cognome").value,
    eta: document.getElementById("eta").value,
    occhi: document.getElementById("occhi").value
  };

  elenco.push(persona);

  localStorage.setItem("elenco", JSON.stringify(elenco));

  alert("Persona salvata!");
}

function vai() {
  let pagina = "secondapagina.html";
  document.location.href = pagina;
}
</script>
</body>
</html>
