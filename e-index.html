<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negozio</title>
  <style>
    :root { --color: #c0392b; --colordark: #a93226; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f5f0e8; color: #2c2c2c; }

    /* NAV */
    nav { background: var(--color); color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .nav-brand { font-size: 1.4rem; font-weight: bold; letter-spacing: -0.5px; }
    .nav-brand span { font-size: 0.75rem; font-weight: normal; opacity: 0.85; display: block; font-style: italic; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .cart-btn { background: #fff; color: var(--color); border: none; padding: 0.5rem 1.2rem; border-radius: 3px; cursor: pointer; font-family: Georgia, serif; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
    .cart-btn:hover { background: #ffe; }
    .cart-count { background: #2c2c2c; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; display: inline-flex; align-items: center; justify-content: center; margin-left: 4px; }
    .config-link { color: rgba(255,255,255,0.7); font-size: 0.8rem; text-decoration: none; }
    .config-link:hover { color: #fff; }

    /* HERO */
    .hero { background: var(--color); color: #fff; padding: 3rem 2rem; text-align: center; }
    .hero h1 { font-size: clamp(1.8rem, 4vw, 3rem); margin-bottom: 0.5rem; }
    .hero p { opacity: 0.85; font-style: italic; }

    /* SEARCH */
    .search-bar { background: #fff; padding: 1.5rem 2rem; border-bottom: 1px solid #ddd; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .search-bar input { flex: 1; min-width: 200px; padding: 0.6rem 1rem; border: 1.5px solid #ddd; border-radius: 3px; font-family: Georgia, serif; font-size: 0.9rem; }
    .search-bar input:focus { outline: none; border-color: var(--color); }
    #results-count { color: #888; font-size: 0.85rem; font-style: italic; }

    /* GRID */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* CARD */
    .product-card { background: #fff; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; cursor: pointer; }
    .product-card:hover { box-shadow: 4px 4px 0 var(--color); transform: translate(-2px, -2px); }
    .product-card img { width: 100%; height: 200px; object-fit: cover; background: #f0f0f0; }
    .card-body { padding: 1rem; }
    .card-brand { font-size: 0.75rem; color: var(--color); font-weight: bold; letter-spacing: 0.1em; text-transform: uppercase; }
    .card-model { font-size: 1.05rem; font-weight: bold; margin: 0.2rem 0; }
    .card-desc { font-size: 0.82rem; color: #666; margin-bottom: 0.8rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-price { font-size: 1.2rem; font-weight: bold; color: var(--color); }
    .add-btn { background: var(--color); color: #fff; border: none; padding: 0.4rem 0.9rem; border-radius: 3px; cursor: pointer; font-size: 0.85rem; font-family: Georgia, serif; transition: background 0.2s; }
    .add-btn:hover { background: var(--colordark); }
    .detail-btn { background: transparent; color: var(--color); border: 1px solid var(--color); padding: 0.4rem 0.9rem; border-radius: 3px; cursor: pointer; font-size: 0.85rem; font-family: Georgia, serif; transition: all 0.2s; margin-right: 0.4rem; }
    .detail-btn:hover { background: var(--color); color: #fff; }

    /* MAPPA */
    .map-section { background: #fff; border-top: 3px solid var(--color); padding: 2rem; margin-top: 2rem; }
    .map-section h2 { font-size: 1.3rem; margin-bottom: 0.3rem; color: #2c2c2c; }
    .map-section p { color: #888; font-size: 0.85rem; font-style: italic; margin-bottom: 1rem; }
    .map-container { border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
    .map-container iframe { width: 100%; height: 350px; border: none; display: block; }

    /* FOOTER */
    footer { background: #2c2c2c; color: #aaa; text-align: center; padding: 1.5rem; font-size: 0.85rem; margin-top: 0; }
    footer a { color: var(--color); text-decoration: none; }

    /* EMPTY */
    .empty { text-align: center; padding: 4rem 2rem; color: #aaa; }
    .empty h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }

    /* TOAST */
    #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #2c2c2c; color: #fff; padding: 0.8rem 1.5rem; border-radius: 4px; font-size: 0.9rem; z-index: 999; transition: transform 0.3s; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .hero { padding: 2rem 1rem; }
      .products-grid { padding: 1rem; gap: 1rem; }
      nav { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand" id="nav-brand">
    🛍️ Negozio
    <span id="nav-tagline">il tuo negozio online</span>
  </div>
  <div class="nav-right">
    <a href="ini.html" class="config-link">⚙️ Config</a>
    <button class="cart-btn" onclick="window.location.href='cart.html'">
      🛒 Carrello <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</nav>

<div class="hero" id="hero-section">
  <h1 id="hero-title">Il Negozio</h1>
  <p id="hero-sub">Scopri i nostri prodotti</p>
</div>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Cerca prodotto, marca, modello..." oninput="filterProducts()">
  <span id="results-count"></span>
</div>

<div class="products-grid" id="products-grid"></div>

<!-- GOOGLE MAPS -->
<div class="map-section">
  <h2> Dove siamo</h2>
  <p>TechShop Milano — Via Madre Teresa di Calcutta 3, 20043 Vanzago (MI)</p>
  <div class="map-container">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2796.5!2d8.994!3d45.527!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4786bfae3c6e0001%3A0xb1234567890abcde!2sVanzago%2C%20MI!5e0!3m2!1sit!2sit!4v1700000000000!5m2!1sit!2sit"
      allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</div>

<footer>
  &copy; 2024 <span id="footer-name">TechShop</span> &mdash; 
  <a href="ini.html">Configurazione</a> &mdash; 
  <a href="cart.html">Carrello</a>
</footer>

<div id="toast">Prodotto aggiunto al carrello!</div>

<script>
  let allProducts = [];
  let config = {};
  let currency = '€';

  function loadConfig() {
    try { config = JSON.parse(localStorage.getItem('shop_config')) || {}; } catch(e) { config = {}; }
    const color = config.color || '#c0392b';
    document.documentElement.style.setProperty('--color', color);
    const dark = shadeColor(color, -20);
    document.documentElement.style.setProperty('--colordark', dark);
    currency = config.currency || '€';
    if (config.name) {
      document.getElementById('nav-brand').innerHTML = '🛍️ ' + config.name + '<span>' + (config.tagline || '') + '</span>';
      document.getElementById('hero-title').textContent = config.name;
      document.getElementById('hero-sub').textContent = config.category ? 'Categoria: ' + config.category : config.tagline || '';
      document.getElementById('footer-name').textContent = config.name;
      document.title = config.name;
    }
  }

  function shadeColor(hex, percent) {
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.max(0, Math.min(255, r + percent)); g = Math.max(0, Math.min(255, g + percent)); b = Math.max(0, Math.min(255, b + percent));
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  function loadProducts() {
    try { allProducts = JSON.parse(localStorage.getItem('shop_products')) || []; } catch(e) { allProducts = []; }
    if (allProducts.length === 0) {
      document.getElementById('products-grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h2>Nessun prodotto</h2><p>Vai alla <a href="ini.html">configurazione</a> per caricare i prodotti</p></div>';
      return;
    }
    renderProducts(allProducts);
  }

  function renderProducts(products) {
    const grid = document.getElementById('products-grid');
    document.getElementById('results-count').textContent = products.length + ' prodotti';
    if (products.length === 0) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><h2>Nessun risultato</h2><p>Prova con un\'altra ricerca</p></div>';
      return;
    }
    grid.innerHTML = products.map((p, i) => {
      const idx = allProducts.indexOf(p);
      return '<div class="product-card">' +
        '<img src="' + p.immagine + '" alt="' + p.modello + '" onerror="this.src=\'https://via.placeholder.com/400x200?text=' + encodeURIComponent(p.modello) + '\'">' +
        '<div class="card-body">' +
          '<div class="card-brand">' + p.marca + '</div>' +
          '<div class="card-model">' + p.modello + '</div>' +
          '<div class="card-desc">' + p.descrizione + '</div>' +
          '<div class="card-footer">' +
            '<div class="card-price">' + parseFloat(p.prezzo).toFixed(2) + ' ' + currency + '</div>' +
            '<div>' +
              '<button class="detail-btn" onclick="vaiDettaglio(' + idx + ')">Dettagli</button>' +
              '<button class="add-btn" onclick="aggiungiCarrello(' + idx + ')">+ Carrello</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function filterProducts() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = allProducts.filter(p =>
      p.marca.toLowerCase().includes(q) ||
      p.modello.toLowerCase().includes(q) ||
      p.descrizione.toLowerCase().includes(q)
    );
    renderProducts(filtered);
  }

  function aggiungiCarrello(idx) {
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('shop_cart')) || []; } catch(e) {}
    const p = allProducts[idx];
    const existing = cart.find(item => item.modello === p.modello && item.marca === p.marca);
    if (existing) { existing.qty = (existing.qty || 1) + 1; }
    else { cart.push({ ...p, qty: 1 }); }
    localStorage.setItem('shop_cart', JSON.stringify(cart));
    updateCartCount();
    showToast(p.modello + ' aggiunto al carrello!');
  }

  function vaiDettaglio(idx) {
    localStorage.setItem('shop_current_product', idx);
    window.location.href = 'product.html';
  }

  function updateCartCount() {
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('shop_cart')) || []; } catch(e) {}
    const total = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
    document.getElementById('cart-count').textContent = total;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  loadConfig();
  loadProducts();
  updateCartCount();
</script>
</body>
</html>
