<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dettaglio Prodotto</title>
  <style>
    :root { --color: #c0392b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #f5f0e8; color: #2c2c2c; }
    nav { background: var(--color); color: #fff; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .nav-brand { font-size: 1.2rem; font-weight: bold; }
    .nav-right { display: flex; gap: 1rem; align-items: center; }
    .back-btn { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.5); padding: 0.4rem 1rem; border-radius: 3px; cursor: pointer; font-family: Georgia, serif; font-size: 0.85rem; }
    .back-btn:hover { background: rgba(255,255,255,0.3); }
    .cart-btn { background: #fff; color: var(--color); border: none; padding: 0.5rem 1.2rem; border-radius: 3px; cursor: pointer; font-family: Georgia, serif; font-weight: bold; }
    .cart-count { background: #2c2c2c; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; display: inline-flex; align-items: center; justify-content: center; margin-left: 4px; }

    .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    .breadcrumb { font-size: 0.8rem; color: #888; margin-bottom: 1.5rem; }
    .breadcrumb a { color: var(--color); text-decoration: none; }
    .breadcrumb span { margin: 0 0.4rem; }

    .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; background: #fff; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
    .product-img { background: #f0f0f0; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; min-height: 350px; display: block; }
    .product-info { padding: 2rem; display: flex; flex-direction: column; gap: 1rem; }
    .badge-brand { display: inline-block; background: var(--color); color: #fff; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; padding: 0.3rem 0.7rem; border-radius: 2px; }
    .product-title { font-size: 1.8rem; line-height: 1.2; }
    .product-desc { color: #555; font-size: 0.95rem; line-height: 1.6; }

    .specs-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .specs-table tr:nth-child(odd) td { background: #f9f9f9; }
    .specs-table td { padding: 0.5rem 0.7rem; border-bottom: 1px solid #eee; }
    .specs-table td:first-child { color: #888; width: 40%; }
    .specs-table td:last-child { font-weight: bold; }

    .price-box { background: #f9f5f0; border-left: 4px solid var(--color); padding: 1rem 1.2rem; border-radius: 0 4px 4px 0; }
    .price-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; }
    .price-value { font-size: 2rem; font-weight: bold; color: var(--color); }

    .btn-group { display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .btn-primary { background: var(--color); color: #fff; border: none; padding: 0.8rem 1.5rem; border-radius: 3px; cursor: pointer; font-family: Georgia, serif; font-size: 1rem; flex: 1; min-width: 140px; }
    .btn-primary:hover { background: #a93226; }
    .btn-secondary { background: transparent; color: var(--color); border: 2px solid var(--color); padding: 0.8rem 1.5rem; border-radius: 3px; cursor: pointer; font-family: Georgia, serif; font-size: 1rem; }
    .btn-secondary:hover { background: var(--color); color: #fff; }

    #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #2c2c2c; color: #fff; padding: 0.8rem 1.5rem; border-radius: 4px; font-size: 0.9rem; z-index: 999; transition: transform 0.3s; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 680px) {
      .product-layout { grid-template-columns: 1fr; }
      .product-img img { min-height: 250px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand" id="nav-brand">🛍️ Negozio</div>
  <div class="nav-right">
    <button class="back-btn" onclick="history.back()">← Torna ai prodotti</button>
    <button class="cart-btn" onclick="window.location.href='cart.html'">
      🛒 Carrello <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</nav>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <span>/</span>
    <span id="bc-model">Prodotto</span>
  </div>

  <div class="product-layout" id="product-layout">
    <div style="text-align:center;padding:3rem;color:#aaa;grid-column:1/-1">Caricamento...</div>
  </div>
</div>

<div id="toast"></div>

<script>
  let config = {};
  let currency = '€';
  let product = null;

  function loadConfig() {
    try { config = JSON.parse(localStorage.getItem('shop_config')) || {}; } catch(e) {}
    const color = config.color || '#c0392b';
    document.documentElement.style.setProperty('--color', color);
    currency = config.currency || '€';
    if (config.name) {
      document.getElementById('nav-brand').textContent = '🛍️ ' + config.name;
      document.title = 'Dettaglio — ' + config.name;
    }
  }

  function loadProduct() {
    const idx = parseInt(localStorage.getItem('shop_current_product'));
    let products = [];
    try { products = JSON.parse(localStorage.getItem('shop_products')) || []; } catch(e) {}
    if (isNaN(idx) || !products[idx]) {
      document.getElementById('product-layout').innerHTML = '<div style="padding:3rem;text-align:center;color:#aaa;grid-column:1/-1"><p>Prodotto non trovato. <a href="index.html" style="color:var(--color)">Torna al negozio</a></p></div>';
      return;
    }
    product = products[idx];
    document.getElementById('bc-model').textContent = product.modello;
    document.title = product.marca + ' ' + product.modello;

    document.getElementById('product-layout').innerHTML =
      '<div class="product-img">' +
        '<img src="' + product.immagine + '" alt="' + product.modello + '" onerror="this.src=\'https://via.placeholder.com/500x400?text=' + encodeURIComponent(product.modello) + '\'">' +
      '</div>' +
      '<div class="product-info">' +
        '<div><span class="badge-brand">' + product.marca + '</span></div>' +
        '<h1 class="product-title">' + product.modello + '</h1>' +
        '<p class="product-desc">' + product.descrizione + '</p>' +
        '<table class="specs-table">' +
          '<tr><td>Marca</td><td>' + product.marca + '</td></tr>' +
          '<tr><td>Modello</td><td>' + product.modello + '</td></tr>' +
          '<tr><td>Categoria</td><td>' + (config.category || '—') + '</td></tr>' +
          '<tr><td>Disponibilità</td><td>✅ Disponibile</td></tr>' +
        '</table>' +
        '<div class="price-box">' +
          '<div class="price-label">Prezzo</div>' +
          '<div class="price-value">' + parseFloat(product.prezzo).toFixed(2) + ' ' + currency + '</div>' +
        '</div>' +
        '<div class="btn-group">' +
          '<button class="btn-primary" onclick="aggiungiCarrello()">🛒 Aggiungi al carrello</button>' +
          '<button class="btn-secondary" onclick="window.location.href=\'cart.html\'">Vai al carrello</button>' +
        '</div>' +
      '</div>';
  }

  function aggiungiCarrello() {
    if (!product) return;
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('shop_cart')) || []; } catch(e) {}
    const existing = cart.find(item => item.modello === product.modello && item.marca === product.marca);
    if (existing) { existing.qty = (existing.qty || 1) + 1; }
    else { cart.push({ ...product, qty: 1 }); }
    localStorage.setItem('shop_cart', JSON.stringify(cart));
    updateCartCount();
    showToast('✅ ' + product.modello + ' aggiunto al carrello!');
  }

  function updateCartCount() {
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem('shop_cart')) || []; } catch(e) {}
    const total = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
    document.getElementById('cart-count').textContent = total;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  loadConfig();
  loadProduct();
  updateCartCount();
</script>
</body>
</html>
