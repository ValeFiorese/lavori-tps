<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei lavori su GitHub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            margin: 0;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .link-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 200px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .link-card:hover {
            transform: scale(1.05);
        }
        .link-card a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }
        .link-card a:hover {
            color: #0077b6;
        }
    </style>
</head>
<body>
    <header>
        <h1>I miei lavori su GitHub</h1>
    </header>

    <div class="container">
        <!-- Link ai tuoi progetti su GitHub -->
        <div class="link-card">
            <a href="https://ValeFiorese.github.io/lavori-tps/Anagrafica2.0.html" target="_blank">Anagrafica 2.0</a>
        </div>
        <div class="link-card">
            <a href="https://ValeFiorese.github.io/valori-tps/Anagrafica 1.1" target="_blank">Anagrafica 1.1</a>
        </div>
        <div class="link-card">
            <a href="https://ValeFiorese.github.io/lavori-tps/Calcolatrice" target="_blank">Calcolatrice</a>
        </div>
        <div class="link-card">
            <a href="https://ValeFiorese.github.io/lavori-tps/Anagrafica 3.0" target="_blank">Calcolatrice</a>
        </div>
        
        <!-- Aggiungi altri progetti qui sotto -->
    </div>
</body>
</html>
